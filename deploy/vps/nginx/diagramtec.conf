# DiagramTec: sitio estático + proxy a la API Node, con HTTPS de Let's Encrypt.
# Se instala en /etc/nginx/sites-available/diagramtec.conf (enlace en sites-enabled).
# Este archivo se carga dentro del contexto http de nginx.
#
# Requiere:
#   /etc/letsencrypt/live/diagramtec.qd.je/       (lo crea certbot en setup.sh)
#   /etc/nginx/snippets/diagramtec-headers.conf
#   /etc/nginx/snippets/diagramtec-proxy.conf
#
# Sin Cloudflare delante, el tráfico llega directo: estos límites frenan floods y
# fuerza bruta antes de llegar a Node (que además tiene sus propios límites).

limit_req_zone  $binary_remote_addr zone=dt_api:10m  rate=10r/s;
limit_req_zone  $binary_remote_addr zone=dt_auth:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=dt_web:10m  rate=30r/s;
limit_conn_zone $binary_remote_addr zone=dt_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# Cortar conexiones lentas (slowloris)
client_body_timeout   15s;
client_header_timeout 15s;
send_timeout          30s;

# --- HTTP (80): redirige a HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name diagramtec.qd.je www.diagramtec.qd.je api.diagramtec.qd.je;
    server_tokens off;

    return 301 https://$host$request_uri;
}

# --- Sitio estático (443) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name diagramtec.qd.je www.diagramtec.qd.je;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/diagramtec.qd.je/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diagramtec.qd.je/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    limit_req  zone=dt_web burst=60 nodelay;
    limit_conn dt_conn 30;

    root /var/www/diagramtec;
    index index.html;

    # Cabeceras de seguridad (también se repiten en cada location con add_header)
    include /etc/nginx/snippets/diagramtec-headers.conf;

    # Nunca servir archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        return 403;
    }

    # Archivos con hash de Vite: cache largo e inmutable
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/diagramtec-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html: nunca en caché
    location = /index.html {
        include /etc/nginx/snippets/diagramtec-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # SPA: cualquier ruta desconocida sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/diagramtec-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}

# --- API (443) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.diagramtec.qd.je;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/diagramtec.qd.je/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diagramtec.qd.je/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 16m;
    limit_conn dt_conn 20;

    location ~ /\. {
        return 403;
    }

    # Login, registro y recuperación: límite estricto por IP (10/min, ráfaga de 10)
    location ~ ^/auth/(login|register|recovery-code|reset-password|resend-verification)$ {
        limit_req zone=dt_auth burst=10 nodelay;
        include /etc/nginx/snippets/diagramtec-proxy.conf;
    }

    location / {
        limit_req zone=dt_api burst=40 nodelay;
        include /etc/nginx/snippets/diagramtec-proxy.conf;
    }
}
