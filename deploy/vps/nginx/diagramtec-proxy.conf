# Proxy hacia la API Node. Se instala en /etc/nginx/snippets/diagramtec-proxy.conf.
# Nginx es el único proxy delante de Node: la API usa TRUST_PROXY=1.
proxy_pass http://127.0.0.1:4002;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Se pisa (no se agrega) para que el cliente no pueda inyectar IPs falsas.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
# Las cabeceras de seguridad las envía la propia API; no se duplican acá.
