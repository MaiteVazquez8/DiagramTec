# Cabeceras de seguridad del sitio estático.
# Réplica exacta de frontend/public/.htaccess (Apache).
# Se instala en /etc/nginx/snippets/diagramtec-headers.conf y se incluye en cada
# location que use add_header (nginx no hereda add_header si el bloque define otros).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# API Node, Turnstile, íconos de Iconify y Google Fonts; nada más puede ejecutarse.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://api.diagramtec.qd.je https://api.iconify.design https://api.simplesvg.com https://api.unisvg.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
