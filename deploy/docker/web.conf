# Sitio estático dentro del contenedor web (nginx sin root, puerto 8080).
# Traefik termina HTTPS y reenvía acá.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/diagramtec-headers.conf;

    # Nunca servir archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        return 403;
    }

    # Archivos con hash de Vite: cache largo e inmutable
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/diagramtec-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA: cualquier ruta desconocida sirve index.html, sin caché
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/diagramtec-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
